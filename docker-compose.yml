services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/support
      LLM_PROVIDER: ${LLM_PROVIDER:-bedrock}
      LLM_MODEL: ${LLM_MODEL:-anthropic.claude-opus-5-5}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Your AWS login from `aws configure`, read-only. Keys stay on your machine.
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      - "8080:8080"

volumes:
  pgdata:
