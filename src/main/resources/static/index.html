<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Assistant</title>
  <style>
    :root { --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --accent: #2f5bea; --user: #e8eefe; --warn: #fff4e5; --border: #e3e6ea; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; height: 100vh; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    #stats { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px; }
    .msg { padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); white-space: pre-wrap; max-width: 90%; }
    .msg.user { background: var(--user); align-self: flex-end; border: none; }
    .msg.escalated { background: var(--warn); }
    .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; }
  </style>
</head>
<body>
<main>
  <h1>Support Assistant</h1>
  <div id="stats">Loading knowledge base…</div>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Ask a question, e.g. How do I fix error 1603?" autocomplete="off" required>
    <button id="send">Send</button>
  </form>
</main>
<script>
  const sessionId = crypto.randomUUID();
  const log = document.getElementById('log');

  function add(text, cls, meta) {
    const div = document.createElement('div');
    div.className = 'msg ' + (cls || '');
    div.textContent = text;
    if (meta) {
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = meta;
      div.appendChild(m);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  fetch('/api/knowledge-base/stats').then(r => r.json()).then(s => {
    document.getElementById('stats').textContent = `${s.documents} documents · ${s.chunks} indexed chunks`;
  }).catch(() => {});

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const input = document.getElementById('input');
    const button = document.getElementById('send');
    const message = input.value.trim();
    if (!message) return;
    add(message, 'user');
    input.value = '';
    button.disabled = true;
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, message })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const r = await res.json();
      const meta = [r.category, r.urgency, r.escalated ? 'escalated: ' + r.escalationReason : 'auto-resolved',
        r.sources.length ? 'sources: ' + r.sources.join(', ') : ''].filter(Boolean).join(' · ');
      add(r.answer, r.escalated ? 'escalated' : '', meta);
    } catch (err) {
      add('Something went wrong: ' + err.message, 'escalated');
    } finally {
      button.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
